<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Demo Certificate Generator</h1>
        
        <div class="mb-6 flex gap-4">
            <select id="certType" class="p-2 border rounded shadow-sm" onchange="updateCert()">
                <option value="genuine">Genuine (Match DB)</option>
                <option value="tampered">Tampered (Changed Marks)</option>
                <option value="fake">Fake (Invalid ID)</option>
            </select>
            <button onclick="downloadCert()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Download as PNG</button>
        </div>

        <div id="certificate" class="bg-white p-16 border-8 border-blue-900 rounded-lg shadow-2xl relative w-full aspect-[1.414/1] flex flex-col items-center text-center">
            <div class="absolute top-12 left-12 w-24 h-24 rounded-full border-4 border-yellow-500 flex items-center justify-center text-yellow-500 font-bold">SEAL</div>
            <h2 class="text-4xl font-serif font-bold text-gray-800 uppercase tracking-widest mt-8 mb-2" id="valInstitution">Ranchi University</h2>
            <div class="text-gray-500 italic mb-8">This is to certify that</div>
            <h3 class="text-5xl font-serif font-bold text-blue-900 mb-6" id="valName">Anjali Kumar</h3>
            <div class="text-lg text-gray-700 mb-8 max-w-lg">
                Has successfully completed the requirements for the degree of 
                <span class="font-bold" id="valCourse">B.Sc</span> 
                with a final grade of 
                <span class="font-bold underline" id="valMarks">78%</span> 
                in the year <span id="valYear">2022</span>.
            </div>
            
            <div class="mt-auto flex justify-between w-full px-12 items-end">
                <div class="text-left border-t border-gray-400 pt-2">
                    <div class="font-semibold text-gray-600 text-sm">Certificate ID</div>
                    <div class="font-mono text-lg font-bold" id="valCertId">C001</div>
                </div>
                <div class="text-center w-48 border-t border-gray-400 pt-2 text-gray-600">
                    Registrar Signature
                </div>
            </div>
        </div>
        
        <div class="mt-8 bg-gray-800 text-green-400 p-4 rounded-lg font-mono text-sm overflow-auto">
            <h4 class="text-white mb-2 font-sans font-bold">JSON Mock Data (Copy to Clipboard):</h4>
            <pre id="jsonOutput"></pre>
        </div>
    </div>

    <script>
        const cases = {
            genuine: { name: 'Anjali Kumar', certId: 'C001', marks: '78%', institution: 'Ranchi University', course: 'B.Sc', year: '2022' },
            tampered: { name: 'Anjali Kumar', certId: 'C001', marks: '99%', institution: 'Ranchi University', course: 'B.Sc', year: '2022' },
            fake: { name: 'Anjali Kumar', certId: 'X999', marks: '78%', institution: 'Ranchi University', course: 'B.Sc', year: '2022' }
        };

        function updateCert() {
            const type = document.getElementById('certType').value;
            const data = cases[type];
            
            document.getElementById('valName').innerText = data.name;
            document.getElementById('valCertId').innerText = data.certId;
            document.getElementById('valMarks').innerText = data.marks;
            document.getElementById('valInstitution').innerText = data.institution;
            document.getElementById('valCourse').innerText = data.course;
            document.getElementById('valYear').innerText = data.year;
            
            document.getElementById('jsonOutput').innerText = JSON.stringify(data, null, 2);
        }

        async function downloadCert() {
            const certElement = document.getElementById('certificate');
            const canvas = await html2canvas(certElement, { scale: 2 });
            const link = document.createElement('a');
            link.download = `certificate_${document.getElementById('certType').value}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Init
        updateCert();
    </script>
</body>
</html>
